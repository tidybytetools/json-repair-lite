[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "json-repair-lite"
version = "1.0.1"
description = "Repair broken or incomplete JSON, including output from language models. Local CLI and MCP server. No API key."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Tidy Byte Tools"}]
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.10,<2",
  "json-repair>=0.64.9,<1",
]
keywords = ["json", "json-repair", "jsonl", "llm", "cli", "mcp", "mcp-server", "data-cleaning"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Text Processing",
  "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/tidybytetools/json-repair-lite"
Documentation = "https://github.com/tidybytetools/json-repair-lite#readme"
Source = "https://github.com/tidybytetools/json-repair-lite"
Issues = "https://github.com/tidybytetools/json-repair-lite/issues"
Changelog = "https://github.com/tidybytetools/json-repair-lite/blob/main/CHANGELOG.md"
Apify = "https://apify.com/tidybytetools/json-repair"

[project.scripts]
json-repair-lite = "json_repair_lite:main"
json-repair-lite-mcp = "json_repair_lite_mcp:main"

[tool.setuptools]
py-modules = ["json_repair_lite", "json_repair_lite_mcp"]
